<!DOCTYPE html>
<html lang="en">
<head th:insert="~{fragments :: th_head}">
</head>
<body>
    <header th:insert="~{fragments :: th_header}"></header>
    <div class="container mt-5 py-3">
      <h1>My Orders</h1>
      <div class=" container mx-5">
        <div class="row my-3 p-4" th:each="order : ${orders}">
          <div class="card col-12">
            <div class="card-body">
              <h5 class="card-title col-6">
                Order Status:
                <span th:if="${order.status.name == 'OnTheWay'}">On the way!</span>
                <span th:if="${orderStatus.name == 'Delivered'}">Delivered!</span>
                <span th:if="${orderStatus.name == 'Pending'}">Pending</span>
              </h5>
              <p class="card-text col-6" th:text="'Order ID: ' + ${order.id}"></p>
            </div>       
            <div class="card-footer py-3 mx-1 row" th:each="cj : ${order.cartJewelryItems}" style="background-color: white;">
                <div class="col-2">
                  <img th:src="'data:image/jpeg;base64,' + ${cj.jewelry.base64Image}" class="card-img-top object-fit-cover" alt="">
                </div>
                <div class="col-8 ">
                  <h4 class="py-2" th:text="${cj.jewelry.name}"></h4>
                  <p class="card-text fs-5" th:text="'Item Price: $' + ${cj.jewelry.price}"></p>
                  <p class="card-text fs-5" th:text="'Qty: ' + ${cj.quantityInOrder}"></p>
                </div>
            </div>
            <div class="card-footer" style="background-color: white;">
              <!-- <h5 class="card-title col-6" th:text="'Order status: ' + ${order.status}"></h5> -->
              <h5 class="card-title col-6" th:text="'Order Total: $' + ${order.totalPrice}"></h5>
              <p class="card-text col-6" th:text="'Order Date: ' + ${order.dateOrdered}"></p>
            </div>            
          </div>
        </div>
      </div>
    </div>
    <div th:insert="~{fragments :: th_footer}"></div>
</body>
</html>
