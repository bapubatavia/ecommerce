<!DOCTYPE html>
<html lang="en">
<head th:insert="~{fragments :: th_head}">
</head>
<body>
    <header th:insert="~{fragments :: th_header}"></header>
    <div class="container">
        <div class="text-center">
            <div class="row">
              <a class="col filter-button bottom-start border-bottom border-end border-secondary py-3 " th:href="'/browse?category=Bracelet'">
                Bracelets
              </a>
              <a class="col filter-button border-bottom border-end border-secondary py-3 " th:href="'/browse?category=Necklace'">
                Necklaces
              </a>
              <a class="col filter-button border-bottom border-end border-secondary py-3 " th:href="'/browse?category=Earring'">
                Earrings
              </a>
              <a class="col filter-button border-bottom border-end border-secondary py-3 " th:href="'/browse?category=Ring'">
                Rings
              </a>                                                      
            </div>
        </div>
    </div>    
    <div class="container mt-5 py-3 rounded" style="background-color: rgb(210, 210, 210);">
      <div class="row row-cols-2 row-cols-md-4 g-4 card-group">
        <div class="col" th:each="item : ${items}">
          <div class="card">
            <a th:href="'/item-details?id=' + ${item.id}">
              <img th:src="'data:image/jpeg;base64,' + ${item.base64Image}" class="card-img-top object-fit-cover" style="height: 303px; width: 303px;" alt="...">
              <div class="card-body">
                <h5 class="card-title" th:text="${item.name}"></h5>
                <p class="card-text" th:text="'$' + ${item.price}"></p>
              </div>
            </a>
            <form method="post">
              <input type="hidden" name="id" id="id" th:value="${item.id}">
              <div class="card-footer text-center py-3">
                  <button type="submit" class="btn p-0 addToCartBtn" th:data-url="'/user/add-to-cart?id=' + ${item.id}" sec:authorize="!hasAuthority('[ROLE_ADMIN]')">
                      <i class="fa-solid fa-cart-shopping fa-xl"></i>
                      <small class="text-body-secondary">Add to cart</small>
                  </button>
              </div>
          </form>
          </div>
        </div>
      </div>
    </div>
    <div th:insert="~{fragments :: th_footer}"></div>
</body>
</html>
