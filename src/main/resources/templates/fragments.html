<!DOCTYPE html>
<html lang="en" data-bs-theme="auto" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="th_head">
    <script src="../assets/js/color-modes.js"></script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
    <title>The Jeweler</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">

    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      body{
        font-family: "Ubuntu";
      }
    
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }

      .b-example-divider {
        width: 100%;
        height: 3rem;
        background-color: rgba(0, 0, 0, .1);
        border: solid rgba(0, 0, 0, .15);
        border-width: 1px 0;
        box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
      }

      .b-example-vr {
        flex-shrink: 0;
        width: 1.5rem;
        height: 100vh;
      }

      .bi {
        vertical-align: -.125em;
        fill: currentColor;
      }

      .nav-scroller {
        position: relative;
        z-index: 2;
        height: 2.75rem;
        overflow-y: hidden;
      }

      .nav-scroller .nav {
        display: flex;
        flex-wrap: nowrap;
        padding-bottom: 1rem;
        margin-top: -1px;
        overflow-x: auto;
        text-align: center;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }

      .btn-bd-primary {
        --bd-violet-bg: #712cf9;
        --bd-violet-rgb: 112.520718, 44.062154, 249.437846;

        --bs-btn-font-weight: 600;
        --bs-btn-color: var(--bs-white);
        --bs-btn-bg: var(--bd-violet-bg);
        --bs-btn-border-color: var(--bd-violet-bg);
        --bs-btn-hover-color: var(--bs-white);
        --bs-btn-hover-bg: #6528e0;
        --bs-btn-hover-border-color: #6528e0;
        --bs-btn-focus-shadow-rgb: var(--bd-violet-rgb);
        --bs-btn-active-color: var(--bs-btn-hover-color);
        --bs-btn-active-bg: #5a23c8;
        --bs-btn-active-border-color: #5a23c8;
      }

      .bd-mode-toggle {
        z-index: 1500;
      }

      .bd-mode-toggle .dropdown-menu .active .bi {
        display: block !important;
      }

      .image-wrapper {
          position: relative;
          display: inline-block;
      }

      .second-image {
          display: none;
          width: 100%;
          height: 100%;
          object-fit: cover;
          position: absolute;
          top: 0;
          left: 0;
      }

      .image-btn {
          position: absolute;
          bottom: 10px;
          left: 10px;
          background-color: #d3a11a;
          color: white;
          border: none;
          padding: 8px 16px;
          font-size: 14px;
          cursor: pointer;
          transition: background-color 0.3s ease;
      }

      .image-wrapper:hover .image-btn {
          background-color:  rgb(185, 183, 183);
          color: black;
      }

      .filter-button{
        background-color: #d3a11a; 
        color: white 
      }

      .filter-button:hover {
          background-color: rgb(185, 183, 183);
          color: black;
      }
    </style>

    
    <!-- Custom styles for this template -->
    <link href="../static/css/headers.css" rel="stylesheet">
</head>
<body>
    <header th:fragment="th_header" class="py-3 border-bottom" style="background-color: #d3a11a;">
        <div class="container-fluid d-grid gap-2 align-items-center" style="grid-template-columns: 0.7fr 2.5fr 0.5fr;">
            <div class="d-flex align-items-center mb-2 mb-lg-0 text-black text-decoration-none">
              <a href="/" class="me-5">
                <img th:src="@{/images/logo-good.png}" style="width: 240px; height: 75px;" alt="">
              </a>
              <a th:href="@{/browse}" class="btn btn-outline-secondary">
                Start Shopping
              </a>
            </div>
            <div class="d-flex align-items-center">
              <form class="w-75 me-5" role="search" th:action="@{'/browse'}">
                <input type="search" class="form-control" placeholder="Search..." aria-label="Search" name="search" id="search">
              </form>
            </div>
            <div class="d-flex align-items-start">
              <div class="flex-shrink-0 dropdown mx-5" sec:authorize="hasAuthority('[ROLE_USER]')">
                <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-regular fa-user fa-2xl"></i>
                </a>
                <ul class="dropdown-menu text-small shadow">
                  <li><a class="dropdown-item" th:href="@{/my-orders}">My orders</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" th:href="@{/logout}">Log out</a></li>
                </ul>
              </div>
              <div class="flex-shrink-0 dropdown mx-5" sec:authorize="hasAuthority('[ROLE_ADMIN]')">
                <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="fa-solid fa-user-tie fa-2xl"></i>
                </a>
                <ul class="dropdown-menu text-small shadow">
                  <li><a class="dropdown-item" th:href="@{/admin/product-list}">Jewelry List</a></li>
                  <li><a class="dropdown-item" th:href="@{/admin/new_item}">Add Jewelry</a></li>
                  <li><a class="dropdown-item" th:href="@{/admin/orders}">Orders</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" th:href="@{/logout}">Log out</a></li>
                </ul>
              </div>
              <div class="flex-shrink-0 dropdown mx-5" sec:authorize="!isAuthenticated()">
                <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-regular fa-user fa-2xl"></i>
                </a>
                <ul class="dropdown-menu text-small shadow">
                  <li><a class="dropdown-item" th:href="@{/registration}">Register</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" th:href="@{/login}">Sign in</a></li>
                </ul>
              </div>                            
              <div class="dropdown pl-5" sec:authorize="hasAuthority('[ROLE_USER]')">
                <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle position-relative" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="fa-brands fa-opencart fa-2xl"></i>
                  <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count-badge" style="display: none;">
                    <span id="cart-count">0</span>
                    <span class="visually-hidden">items in cart</span>
                </span>
                </a>
                <ul class="dropdown-menu cart text-small shadow">
                  <li><a class="dropdown-item active" href="#" aria-current="page">Overview</a></li>
                  <li><a class="dropdown-item" href="/inventory/list">Inventory</a></li>
                  <li><a class="dropdown-item" href="#">Customers</a></li>
                  <li><a class="dropdown-item" href="#">Products</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" th:href="@{/check-out}">Go to Check-Out</a></li>
                </ul>
              </div>
            </div>
        </div>     
    </header>
    <div th:fragment="th_footer" style="background-color: rgb(185, 183, 183);">
        <div  class="container">
            <script>
              const imageWrappers = document.querySelectorAll('.image-wrapper');

              imageWrappers.forEach(wrapper => {
                  const secondImage = wrapper.querySelector('.second-image');

                  wrapper.addEventListener('mouseenter', () => {
                      secondImage.style.display = 'block';
                  });

                  wrapper.addEventListener('mouseleave', () => {
                      secondImage.style.display = 'none';
                  });
              });
            </script>
            <script th:inline="javascript" th:inserted="true">
              const csrfToken = /*[[${_csrf.token}]]*/ 'default_token';
              /*<![CDATA[*/
              function createClearCartForm() {
                const form = document.createElement('form');
                form.action = '/api/cart/delete';
                form.method = 'POST';

                const csrfTokenInput = document.createElement('input');
                csrfTokenInput.type = 'hidden';
                csrfTokenInput.name = '_csrf';
                csrfTokenInput.value = csrfToken;

                const clearButton = document.createElement('button');
                clearButton.type = 'submit';
                clearButton.classList.add('dropdown-item', 'py-2');
                clearButton.style.backgroundColor = 'rgb(185, 183, 183)';
                clearButton.textContent = 'Clear';

                const formItem = document.createElement('li');
                formItem.appendChild(form);
                form.appendChild(csrfTokenInput);
                form.appendChild(clearButton);

                return formItem;
              }

              function updateCart() {
                  fetch('/api/cart/count', {
                      method: 'GET',
                      headers: {
                          'Content-Type': 'application/json',
                          'X-CSRF-TOKEN': csrfToken
                      }
                  })
                  .then(response => response.json())
                  .then(data => {
                      const cartCountBadge = document.getElementById('cart-count-badge');
                      const cartCount = document.getElementById('cart-count');
                      const dropdownMenu = document.querySelector('.cart');
                      console.log(dropdownMenu);
                      cartCount.textContent = data.cartItemCount;

                      if (data.cartItemCount === 0) {
                          cartCountBadge.style.display = 'none';
                          dropdownMenu.innerHTML = '';
                          const menuItem = document.createElement('li');
                          menuItem.innerHTML = `<a class="dropdown-item" href="#">No items in cart!</a>`;
                          dropdownMenu.append(menuItem);   
                          console.log(menuItem);                     
                      } else {
                          cartCountBadge.style.display = 'inline-block';

                          dropdownMenu.innerHTML = ''; //remove cart dropdown menu content
                          data.jewelryList.forEach(jewelry =>{
                            const menuItem = document.createElement('li');
                            menuItem.innerHTML = `<a class="dropdown-item" th:href="@{#}">Item: ${jewelry.jewelry.name} <br> Price: $${jewelry.jewelry.price} <br> Qty: ${jewelry.quantityInOrder}</a>`;
                            dropdownMenu.append(menuItem);
                          })

                          dropdownMenu.innerHTML += `
                              <li><hr class="dropdown-divider mb-0"></li>
                              <li><a class="dropdown-item py-2" style="background-color: #d3a11a;" href="/my-cart"> Edit </a></li>
                              <li><hr class="dropdown-divider my-0"></li>
                          `;
                          const clearCartFormItem = createClearCartForm();
                          dropdownMenu.appendChild(clearCartFormItem); 
                          dropdownMenu.innerHTML += `
                              <li><hr class="dropdown-divider mt-0"></li>
                              <li><a class="dropdown-item">SubTotal: $${data.subTotal}</a></li>
                              <li><hr class="dropdown-divider"></li>
                              <li><a class="dropdown-item" href="/check-out">Go to Check-Out</a></li>
                          `;

                          
                      }
                       


                  })
                  .catch(error => console.error('Error:', error));
              }
          
              // Update cart count on page load
              updateCart();
          
              // Update cart count when adding to cart
              const addToCartBtns = document.querySelectorAll('.addToCartBtn');
              console.log(addToCartBtns);
              addToCartBtns.forEach(function(addToCartBtn) {
                addToCartBtn.addEventListener('click', () => {
                      const addToCartUrl = addToCartBtn.dataset.url;
                      event.preventDefault();
                      fetch(addToCartUrl, {
                          method: 'POST',
                          headers: {
                              'Content-Type': 'application/json',
                              'X-CSRF-TOKEN': csrfToken
                          }
                      })
                      .then(response => response.text())
                      .then(responseText => {
                        console.log(responseText);
                        if (responseText === "Not enough items in stock, please select something else!") {
                            alert(responseText);
                        } else {
                            updateCart();
                            window.location.href = "/browse";
                        }
                      })
                      .catch(error => console.error('Error:', error));
                });
              })
              /*]]>*/
            </script> 
            <footer  class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-2 fixed-bottom" style="background-color:  rgb(185, 183, 183);">
                <div class="col-md-4 d-flex align-items-center">
                <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
                    <svg class="bi" width="30" height="24"><use xlink:href="#bootstrap"/></svg>
                </a>
                <span class="mb-3 mb-md-0 text-body-secondary">&copy; 2024 The Jeweler, Inc</span>
                </div>
            
                <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3 px-2"><a class="text-body-secondary" href="#"><i class="fa-brands fa-twitter fa-xl"></i></a></li>
                <li class="ms-3 px-2"><a class="text-body-secondary" href="#"><i class="fa-brands fa-instagram fa-xl"></i></a></li>
                <li class="ms-3 px-2 me-4"><a class="text-body-secondary" href="#"><i class="fa-brands fa-facebook fa-xl"></i></a></li>
                </ul>
            </footer>
        </div>
    </div>
</body>
</html>
