<!DOCTYPE html>
<html lang="en">
<head th:insert="~{/fragments :: th_head}">
</head>
<body>
    <header th:insert="~{/fragments :: th_header}"></header>
    <div class="container my-5 mx-auto justify-content-center text-center">
        <div class="row mt-2 justify-content-center">
            <div th:if="${param.error}" class="col-sm-8">
                   <p class="alert alert-danger">Wrong email/password, please try again.</p>
            </div>
        </div>
        <div class="row mt-2 justify-content-center">
            <div th:if="${param.success}" class="col-sm-8">
                   <p class="alert alert-info">Registration successful!<br>Please login.</p>
            </div>
        </div>        
        <div class="m-5 text-center">
            <h2>User Login</h2>
        </div>

        <form th:action="@{/login}" method="post" class="mx-5 text-center justify-content-center my-5">
            <div class="mb-3 row justify-content-center my-5">
                <label for="email" class="col-sm-2 col-form-label">Email</label>
                <div class="col-sm-4">
                  <input type="text" required autofocus="autofocus" id="email" class="form-control" placeholder="email@example.com" name="email">
                </div>
            </div>
            <div class="mb-3 row justify-content-center my-5 pb-5">
                <label for="password" class="col-sm-2 col-form-label">Password</label>
                <div class="col-sm-4">
                  <input type="password" required autofocus="autofocus" id="password" class="form-control" name="password">
                </div>
            </div>
            <div>
                <button type="submit" class="btn btn-success">Login</button>
                <div class="mt-2 mb-5">Don't have an account yet? <a th:href="@{/registration}">
                    Register here.
                </a> </div>
            </div>
        </form>
    </div>
    <div th:insert="~{/fragments :: th_footer}"></div>
</body>
</html>
