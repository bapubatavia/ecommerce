<!DOCTYPE html>
<html lang="en">
<head th:insert="~{/fragments :: th_head}">
</head>
<body>
    <header th:insert="~{/fragments :: th_header}"></header>
    <div class="container my-5 text-center">
        <div class="row mt-2">
            <div th:if="${param.success}" class="col-sm-8">
                   <p class="alert alert-info">Registration successful!<br>Please login.</p>
            </div>
        </div>
    </div>
    <h1 class="text-center pb-3 mb-3">Orders</h1>
    <div class="container px-0 mx-auto">
        <div class="row justify-content-center">
            <div class="px-0">
                <table class="table table-hover rounded-3">
                    <thead class="table-secondary">
                        <tr>
                            <th style="width: 5%;">Order ID</th>
                            <th style="width: 5%;">Client ID</th>
                            <th style="width: 20%;">Items</th>
                            <th style="width: 10%;">Total</th>
                            <th style="width: 10%;">Date ordered</th>
                            <th style="width: 15%;">Billing Address</th>
                            <th style="width: 10%;">Payment Method</th>
                            <th style="width: 10%;">Status</th>
                            <th style="width: 15%;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="py-2" th:each="order : ${orders}">
                            <th:block th:if="${order != null}">
                                <td th:text="${order.id}"></td>
                                <td th:text="${order.client.id}"></td>
                                <td th:text="${order.cartJewelryItems.toString}"></td>
                                <td th:text="'$' + ${order.totalPrice}"></td>
                                <td th:text="${order.dateOrdered}"></td>
                                <td th:text="${order.billingAddress.toString}"></td>
                                <td>
                                    <span th:if="${order.billingAddress.paymentMethod == 'mobileMoney'}">Mobile Money</span>
                                    <span th:if="${order.billingAddress.paymentMethod != 'mobileMoney'}">Debit Card</span>
                                </td>
                                <td th:if="${order.status != null}">
                                    <span th:if="${order.status.name == 'Pending'}">Pending</span>
                                    <span th:if="${order.status.name == 'OnTheWay'}">On The Way</span>
                                    <span th:if="${order.status.name == 'Delivered'}">Delivered</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/update-order}" method="post">

                                        <div class="dropdown">
                                            <input type="hidden" name="orderId" id="orderId" th:value="${order.id}" />
                                            <label for="categoryPicked" class="col-form-label">Status</label>
                                                <select id="statusPicked" class="form-select" name="statusPicked" th:value="${statusPicked}" required>
                                                    <option th:value="Pending" th:selected="${statusPicked == 'Pending'}">Pending</option>
                                                    <option th:value="OnTheWay" th:selected="${statusPicked == 'OnTheWay'}">On the Way</option>
                                                    <option th:value="Delivered" th:selected="${statusPicked == 'Delivered'}">Delivered</option>
                                                </select>
                                            <button type="submit" class="btn btn-primary">Set</button>
                                        </div>
                                    </form>                             
                                </td>
                            </th:block>
                        </tr>                        
                    </tbody>
                </table>
            </div>
        </div>    
    </div>  
    <div th:insert="~{/fragments :: th_footer}"></div>
</body>
</html>
